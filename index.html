<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- css bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUalbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<form>
    <h1 class="text-center my-5">Crea i tuoi articoli</h1>
    <div class="d-flex justify-content-center">
        <input type="text" placeholder="titolo">
    </div>
    <div class="d-flex justify-content-center mt-5">
        <textarea placeholder="descrizione" cols="50" rows="10"></textarea>
    </div>
    <div class="d-flex justify-content-center mt-5">
        <button type="button" class="btn btn-outline-info">Crea l'articolo</button>
    </div>
</form>

<div class="container">

</div>


<!-- js bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<!-- main js -->
<script src="./main.js"></script>
</body>
</html>
